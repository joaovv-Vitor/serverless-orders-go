AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless Orders - phase 4 SNS publishing

Globals:
  Function:
    MemorySize: 128
    Timeout: 5

Resources:
  OrderEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: order-events

  OrdersHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Environment:
        Variables:
          ORDER_EVENTS_TOPIC_ARN: !Ref OrderEventsTopic
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: PublishOrderEvents
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref OrderEventsTopic
      Events:
        CreateOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrdersHttpApi
            Path: /orders
            Method: POST
            PayloadFormatVersion: "2.0"
    Metadata:
      BuildMethod: makefile

Outputs:
  OrderEventsTopicArn:
    Description: ARN of the order events SNS topic
    Value: !Ref OrderEventsTopic

  OrdersApiUrl:
    Description: Base URL of the orders HTTP API
    Value: !Sub https://${OrdersHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}

  CreateOrderFunctionName:
    Description: Name of the CreateOrder Lambda function
    Value: !Ref CreateOrderFunction
