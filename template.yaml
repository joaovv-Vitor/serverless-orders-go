AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless Orders - phase 11 observability

Parameters:
  StockFailureCustomerId:
    Type: String
    Default: ""
    Description: Customer ID that forces stock processing to fail during development

  NotificationFailureCustomerId:
    Type: String
    Default: ""
    Description: Customer ID that forces notification sending to fail during development

Globals:
  Function:
    MemorySize: 128
    Timeout: 5

Resources:
  ProcessedEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: consumer
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: consumer
          KeyType: HASH
        - AttributeName: eventId
          KeyType: RANGE

  OrderEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: order-events

  StockDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: stock-dlq
      FifoQueue: false
      MessageRetentionPeriod: 1209600

  StockQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: stock-queue
      FifoQueue: false
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt StockDLQ.Arn
        maxReceiveCount: 3

  StockQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref StockQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowOrderEventsTopic
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - sqs:SendMessage
            Resource: !GetAtt StockQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref OrderEventsTopic

  StockQueueSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: StockQueuePolicy
    Properties:
      TopicArn: !Ref OrderEventsTopic
      Protocol: sqs
      Endpoint: !GetAtt StockQueue.Arn
      RawMessageDelivery: true

  NotificationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: notification-dlq
      FifoQueue: false
      MessageRetentionPeriod: 1209600

  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: notification-queue
      FifoQueue: false
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationDLQ.Arn
        maxReceiveCount: 3

  NotificationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref NotificationQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowOrderEventsTopic
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - sqs:SendMessage
            Resource: !GetAtt NotificationQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref OrderEventsTopic

  NotificationQueueSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: NotificationQueuePolicy
    Properties:
      TopicArn: !Ref OrderEventsTopic
      Protocol: sqs
      Endpoint: !GetAtt NotificationQueue.Arn
      RawMessageDelivery: true

  OrdersHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Environment:
        Variables:
          ORDER_EVENTS_TOPIC_ARN: !Ref OrderEventsTopic
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: PublishOrderEvents
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref OrderEventsTopic
      Events:
        CreateOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrdersHttpApi
            Path: /orders
            Method: POST
            PayloadFormatVersion: "2.0"
    Metadata:
      BuildMethod: makefile

  ProcessStockFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Environment:
        Variables:
          FORCE_FAILURE_CUSTOMER_ID: !Ref StockFailureCustomerId
          IDEMPOTENCY_TABLE_NAME: !Ref ProcessedEventsTable
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: PollStockQueue
              Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt StockQueue.Arn
            - Sid: ManageStockIdempotency
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt ProcessedEventsTable.Arn
      Events:
        StockQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt StockQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
    Metadata:
      BuildMethod: makefile

  SendNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Environment:
        Variables:
          FORCE_FAILURE_CUSTOMER_ID: !Ref NotificationFailureCustomerId
          IDEMPOTENCY_TABLE_NAME: !Ref ProcessedEventsTable
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: PollNotificationQueue
              Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt NotificationQueue.Arn
            - Sid: ManageNotificationIdempotency
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt ProcessedEventsTable.Arn
      Events:
        NotificationQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt NotificationQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
    Metadata:
      BuildMethod: makefile

  CreateOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CreateOrderFunction}
      RetentionInDays: 14

  ProcessStockLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProcessStockFunction}
      RetentionInDays: 14

  SendNotificationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SendNotificationFunction}
      RetentionInDays: 14

  ObservabilityDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-orders
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda invocations",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "period": 60,
                "stat": "Sum",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${CreateOrderFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${ProcessStockFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${SendNotificationFunction}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda errors",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "period": 60,
                "stat": "Sum",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${CreateOrderFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${ProcessStockFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${SendNotificationFunction}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 24,
              "height": 6,
              "properties": {
                "title": "Lambda duration",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "period": 60,
                "stat": "Average",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${CreateOrderFunction}"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${ProcessStockFunction}"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${SendNotificationFunction}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 12,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "SQS available messages",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "period": 60,
                "stat": "Average",
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${StockQueue.QueueName}"],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${NotificationQueue.QueueName}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 12,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "SQS messages in flight",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "period": 60,
                "stat": "Average",
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesNotVisible", "QueueName", "${StockQueue.QueueName}"],
                  ["AWS/SQS", "ApproximateNumberOfMessagesNotVisible", "QueueName", "${NotificationQueue.QueueName}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 12,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "DLQ available messages",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "period": 60,
                "stat": "Average",
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${StockDLQ.QueueName}"],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${NotificationDLQ.QueueName}"]
                ]
              }
            }
          ]
        }

Outputs:
  ObservabilityDashboardName:
    Description: Name of the CloudWatch observability dashboard
    Value: !Ref ObservabilityDashboard

  ProcessedEventsTableName:
    Description: Name of the DynamoDB table used for consumer idempotency
    Value: !Ref ProcessedEventsTable

  ProcessedEventsTableArn:
    Description: ARN of the DynamoDB table used for consumer idempotency
    Value: !GetAtt ProcessedEventsTable.Arn

  OrderEventsTopicArn:
    Description: ARN of the order events SNS topic
    Value: !Ref OrderEventsTopic

  StockQueueUrl:
    Description: URL of the stock SQS queue
    Value: !Ref StockQueue

  StockQueueArn:
    Description: ARN of the stock SQS queue
    Value: !GetAtt StockQueue.Arn

  StockDLQUrl:
    Description: URL of the stock dead-letter queue
    Value: !Ref StockDLQ

  StockDLQArn:
    Description: ARN of the stock dead-letter queue
    Value: !GetAtt StockDLQ.Arn

  NotificationQueueUrl:
    Description: URL of the notification SQS queue
    Value: !Ref NotificationQueue

  NotificationQueueArn:
    Description: ARN of the notification SQS queue
    Value: !GetAtt NotificationQueue.Arn

  NotificationDLQUrl:
    Description: URL of the notification dead-letter queue
    Value: !Ref NotificationDLQ

  NotificationDLQArn:
    Description: ARN of the notification dead-letter queue
    Value: !GetAtt NotificationDLQ.Arn

  OrdersApiUrl:
    Description: Base URL of the orders HTTP API
    Value: !Sub https://${OrdersHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}

  CreateOrderFunctionName:
    Description: Name of the CreateOrder Lambda function
    Value: !Ref CreateOrderFunction

  ProcessStockFunctionName:
    Description: Name of the ProcessStock Lambda function
    Value: !Ref ProcessStockFunction

  SendNotificationFunctionName:
    Description: Name of the SendNotification Lambda function
    Value: !Ref SendNotificationFunction
