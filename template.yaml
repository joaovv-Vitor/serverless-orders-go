AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless Orders - phase 6 stock processing

Globals:
  Function:
    MemorySize: 128
    Timeout: 5

Resources:
  OrderEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: order-events

  StockQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: stock-queue
      FifoQueue: false

  StockQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref StockQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowOrderEventsTopic
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - sqs:SendMessage
            Resource: !GetAtt StockQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref OrderEventsTopic

  StockQueueSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: StockQueuePolicy
    Properties:
      TopicArn: !Ref OrderEventsTopic
      Protocol: sqs
      Endpoint: !GetAtt StockQueue.Arn
      RawMessageDelivery: true

  OrdersHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Environment:
        Variables:
          ORDER_EVENTS_TOPIC_ARN: !Ref OrderEventsTopic
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: PublishOrderEvents
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref OrderEventsTopic
      Events:
        CreateOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrdersHttpApi
            Path: /orders
            Method: POST
            PayloadFormatVersion: "2.0"
    Metadata:
      BuildMethod: makefile

  ProcessStockFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: PollStockQueue
              Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt StockQueue.Arn
      Events:
        StockQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt StockQueue.Arn
            BatchSize: 1
    Metadata:
      BuildMethod: makefile

Outputs:
  OrderEventsTopicArn:
    Description: ARN of the order events SNS topic
    Value: !Ref OrderEventsTopic

  StockQueueUrl:
    Description: URL of the stock SQS queue
    Value: !Ref StockQueue

  StockQueueArn:
    Description: ARN of the stock SQS queue
    Value: !GetAtt StockQueue.Arn

  OrdersApiUrl:
    Description: Base URL of the orders HTTP API
    Value: !Sub https://${OrdersHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}

  CreateOrderFunctionName:
    Description: Name of the CreateOrder Lambda function
    Value: !Ref CreateOrderFunction

  ProcessStockFunctionName:
    Description: Name of the ProcessStock Lambda function
    Value: !Ref ProcessStockFunction
